# Hoojah Theme Settings
# Configure your theme appearance and behavior

# Brand Settings
brand_logo:
  type: upload
  default: ""
  description: "Upload your custom logo (replaces default Discourse logo)"

brand_color:
  type: string
  default: "#415DE6"
  description: "Primary brand color (hex color code)"

# Typography
enable_custom_fonts:
  type: bool
  default: false
  description: "Enable custom font styling"

# Layout Options
enable_wide_layout:
  type: bool
  default: false
  description: "Enable wider content layout for desktop"

# Custom CSS/JS
custom_css:
  type: string
  default: ""
  textarea: true
  description: "Add custom CSS to override theme styles"
