<script type="text/discourse-plugin" version="1.14">
  // DEPRECATION WARNING: This code uses deprecated patterns and will not work in Discourse 3.x
  // - Raw templates (.hbr files) are no longer supported
  // - modifyClass should be replaced with plugin outlets or transformers
  // - Topic list architecture has been completely rewritten
  // See MODERNIZATION_NOTES.md for migration guide

  const { findRawTemplate } = require("discourse-common/lib/raw-templates");

  // DEPRECATED: modifyClass is discouraged, raw templates removed in 3.x
  api.modifyClass('component:topic-list-item', {
    pluginId: 'hoojah-theme', // Added for proper identification

    renderTopicListItem() {
      const template = findRawTemplate("list/custom-topic-list-item");
      if (template) {
        this.set("topicListItemContents", template(this).htmlSafe());
      }
    },
  });
</script>
